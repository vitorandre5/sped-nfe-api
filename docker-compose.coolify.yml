# Usage
#   Start:              docker compose up -d
#   Stop:               docker compose down
#   Dev mode:           docker compose -f docker-compose.yml -f ./dev/docker-compose.dev.yml up -d
#   Reset everything:   sh reset.sh
#
# Notes:
#   - Nested variable interpolation (${A:-${B}}) requires podman-compose >= 1.6.0
#

services:

  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      # Listen on all IPv4 interfaces
      HOSTNAME: "0.0.0.0"

      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}

      # See: https://supabase.com/docs/guides/self-hosting/remove-superuser-access
      POSTGRES_USER_READ_WRITE: postgres

      PG_META_CRYPTO_KEY: ${SERVICE_HEX_32_PGMETACRYPTO}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}

      DEFAULT_ORGANIZATION_NAME: Fiscal
      DEFAULT_PROJECT_NAME: Fiscal
      OPENAI_API_KEY: ""

      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: https://supabase-fiscal.oc2.freeddns.org
      SUPABASE_ANON_KEY: ${SERVICE_SUPABASEANON_JWT}
      SUPABASE_SERVICE_KEY: ${SERVICE_SUPABASESERVICE_JWT}
      AUTH_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}

      # See: docker-compose.logs.yml
      ENABLED_FEATURES_LOGS_ALL: "false"

      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - ./deployment/supabase/coolify-config/snippets:/app/snippets:z
      - ./deployment/supabase/coolify-config/functions:/app/edge-functions:ro,z

  # Envoy is the default API gateway
  # See: https://github.com/orgs/supabase/discussions/48048
  api-gw:
    image: envoyproxy/envoy:v1.39.1
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      default:
        # Expose `envoy` and `kong` as network aliases, so internal configs
        # that reference either hostname resolve to whichever gateway is active.
        aliases:
          - envoy
          - kong
    healthcheck:
      # Using a TCP port check because this image does not include curl or wget.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      studio:
        condition: service_healthy
    volumes:
      - ./deployment/supabase/coolify-config/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./deployment/supabase/coolify-config/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./deployment/supabase/coolify-config/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./deployment/supabase/coolify-config/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${SERVICE_SUPABASEANON_JWT}
      SERVICE_ROLE_KEY: ${SERVICE_SUPABASESERVICE_JWT}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      SUPABASE_PUBLIC_URL: https://supabase-fiscal.oc2.freeddns.org
      SERVICE_FQDN_API_GW_8000: supabase-fiscal.oc2.freeddns.org
      DASHBOARD_USERNAME: fiscaladmin
      DASHBOARD_PASSWORD: ${SERVICE_PASSWORD_64_DASHBOARD}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://supabase-fiscal.oc2.freeddns.org/auth/v1

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/postgres

      GOTRUE_SITE_URL: https://fiscal.oc2.freeddns.org
      GOTRUE_URI_ALLOW_LIST: https://fiscal.oc2.freeddns.org
      GOTRUE_DISABLE_SIGNUP: true

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600

      # Legacy symmetric HS256 key
      GOTRUE_JWT_SECRET: ${SERVICE_PASSWORD_JWT}

      # JSON array of signing JWKs (EC private + legacy symmetric)
      # For Podman, use: GOTRUE_JWT_KEYS: ${JWT_KEYS}
      #GOTRUE_JWT_KEYS: ${JWT_KEYS:-[]}

      GOTRUE_JWT_ISSUER: https://supabase-fiscal.oc2.freeddns.org/auth/v1

      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: false
      GOTRUE_MAILER_AUTOCONFIRM: false

      # Uncomment to bypass nonce check in ID Token flow. Commonly set to true when using Google Sign In on mobile.
      # GOTRUE_EXTERNAL_SKIP_NONCE_CHECK: "true"

      # GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      # GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_SMTP_ADMIN_EMAIL: admin@oc2.freeddns.org
      GOTRUE_SMTP_HOST: ""
      GOTRUE_SMTP_PORT: 587
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: Fiscal
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      GOTRUE_EXTERNAL_PHONE_ENABLED: false
      GOTRUE_SMS_AUTOCONFIRM: false

      # Uncomment to enable OAuth / social login providers.
      # GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED}
      # GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      # GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://supabase-fiscal.oc2.freeddns.org/auth/v1/callback

      # GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED}
      # GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      # GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_SECRET}
      # GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: https://supabase-fiscal.oc2.freeddns.org/auth/v1/callback

      # GOTRUE_EXTERNAL_AZURE_ENABLED: ${AZURE_ENABLED}
      # GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      # GOTRUE_EXTERNAL_AZURE_SECRET: ${AZURE_SECRET}
      # GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: https://supabase-fiscal.oc2.freeddns.org/auth/v1/callback

      # Uncomment to configure SMS delivery (phone auth and phone MFA).
      # GOTRUE_SMS_PROVIDER: ${SMS_PROVIDER}
      # GOTRUE_SMS_OTP_EXP: ${SMS_OTP_EXP}
      # GOTRUE_SMS_OTP_LENGTH: ${SMS_OTP_LENGTH}
      # GOTRUE_SMS_MAX_FREQUENCY: ${SMS_MAX_FREQUENCY}
      # GOTRUE_SMS_TEMPLATE: ${SMS_TEMPLATE}

      # Twilio credentials (when SMS_PROVIDER=twilio)
      # GOTRUE_SMS_TWILIO_ACCOUNT_SID: ${SMS_TWILIO_ACCOUNT_SID}
      # GOTRUE_SMS_TWILIO_AUTH_TOKEN: ${SMS_TWILIO_AUTH_TOKEN}
      # GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: ${SMS_TWILIO_MESSAGE_SERVICE_SID}

      # Test OTP mappings for development
      # GOTRUE_SMS_TEST_OTP: ${SMS_TEST_OTP}

      # Uncomment to configure multi-factor authentication (MFA).
      # GOTRUE_MFA_TOTP_ENROLL_ENABLED: ${MFA_TOTP_ENROLL_ENABLED}
      # GOTRUE_MFA_TOTP_VERIFY_ENABLED: ${MFA_TOTP_VERIFY_ENABLED}
      # GOTRUE_MFA_PHONE_ENROLL_ENABLED: ${MFA_PHONE_ENROLL_ENABLED}
      # GOTRUE_MFA_PHONE_VERIFY_ENABLED: ${MFA_PHONE_VERIFY_ENABLED}
      # GOTRUE_MFA_MAX_ENROLLED_FACTORS: ${MFA_MAX_ENROLLED_FACTORS}

      # SAML SSO
      # See: https://supabase.com/docs/guides/self-hosting/self-hosted-saml-sso
      # GOTRUE_SAML_ENABLED: ${SAML_ENABLED}
      # GOTRUE_SAML_PRIVATE_KEY: ${SAML_PRIVATE_KEY}
      # GOTRUE_SAML_ALLOW_ENCRYPTED_ASSERTIONS: ${SAML_ALLOW_ENCRYPTED_ASSERTIONS}
      # GOTRUE_SAML_RELAY_STATE_VALIDITY_PERIOD: ${SAML_RELAY_STATE_VALIDITY_PERIOD}
      # GOTRUE_SAML_RATE_LIMIT_ASSERTION: ${SAML_RATE_LIMIT_ASSERTION}
      # Optional, defaults to API_EXTERNAL_URL if not set
      # GOTRUE_SAML_EXTERNAL_URL: ${SAML_EXTERNAL_URL}

      # Uncomment to enable custom access token hook.
      # See: https://supabase.com/docs/guides/auth/auth-hooks for
      # full list of hooks and additional details about custom_access_token_hook

      # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/custom_access_token_hook"
      # GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_SECRETS: "<standard-base64-secret>"

      # GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_ENABLED: "true"
      # GOTRUE_HOOK_MFA_VERIFICATION_ATTEMPT_URI: "pg-functions://postgres/public/mfa_verification_attempt"

      # GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "true"
      # GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: "pg-functions://postgres/public/password_verification_attempt"

      # GOTRUE_HOOK_SEND_SMS_ENABLED: "false"
      # GOTRUE_HOOK_SEND_SMS_URI: "pg-functions://postgres/public/custom_access_token_hook"
      # GOTRUE_HOOK_SEND_SMS_SECRETS: "v1,whsec_VGhpcyBpcyBhbiBleGFtcGxlIG9mIGEgc2hvcnRlciBCYXNlNjQgc3RyaW5n"

      # GOTRUE_HOOK_SEND_EMAIL_ENABLED: "false"
      # GOTRUE_HOOK_SEND_EMAIL_URI: "http://host.docker.internal:54321/functions/v1/email_sender"
      # GOTRUE_HOOK_SEND_EMAIL_SECRETS: "v1,whsec_VGhpcyBpcyBhbiBleGFtcGxlIG9mIGEgc2hvcnRlciBCYXNlNjQgc3RyaW5n"

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "postgrest", "--ready" ]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon

      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost

      # PostgREST accepts a plain-text symmetric secret, a single JWK, or a JWKS.
      # For Podman, use either PGRST_JWT_SECRET: ${SERVICE_PASSWORD_JWT} or
      # PGRST_JWT_SECRET: ${JWT_JWKS}
      PGRST_JWT_SECRET: ${SERVICE_PASSWORD_JWT}

      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    command:
      [
        "postgrest"
      ]

  realtime:
    # This container name looks inconsistent but is correct because realtime constructs tenant id by parsing the subdomain
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${SERVICE_SUPABASEANON_JWT}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${SERVICE_HEX_32_REALTIMEKEY}

      # Legacy symmetric HS256 key
      API_JWT_SECRET: ${SERVICE_PASSWORD_JWT}

      # JWKS for token verification (EC public + legacy symmetric).
      # For Podman, use: API_JWT_JWKS: ${JWT_JWKS}
      #API_JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}

      SECRET_KEY_BASE: ${SERVICE_BASE64_64_SECRETKEYBASE}
      METRICS_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  # To use S3 backed storage: docker compose -f docker-compose.yml -f docker-compose.s3.yml up
  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://storage:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${SERVICE_SUPABASEANON_JWT}
      SERVICE_KEY: ${SERVICE_SUPABASESERVICE_JWT}
      POSTGREST_URL: http://rest:3000

      # Legacy symmetric HS256 key
      AUTH_JWT_SECRET: ${SERVICE_PASSWORD_JWT}

      # JWKS for token verification (EC public + legacy symmetric).
      # For Podman, use: JWT_JWKS: ${JWT_JWKS}
      #JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}

      DATABASE_URL: postgres://supabase_storage_admin:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/postgres
      STORAGE_PUBLIC_URL: https://supabase-fiscal.oc2.freeddns.org
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 20971520
      STORAGE_BACKEND: file
      # S3 bucket when using S3 backend, directory name when using 'file'
      GLOBAL_S3_BUCKET: stub
      # S3 Backend configuration
      #GLOBAL_S3_ENDPOINT: https://your-s3-endpoint
      #GLOBAL_S3_PROTOCOL: https
      #GLOBAL_S3_FORCE_PATH_STYLE: "true"
      #AWS_ACCESS_KEY_ID: your-access-key-id
      #AWS_SECRET_ACCESS_KEY: your-secret-access-key
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: fiscal
      # TODO: https://github.com/supabase/storage-api/issues/55
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      # S3 protocol endpoint configuration
      S3_PROTOCOL_ACCESS_KEY_ID: ${SERVICE_HEX_32_S3ACCESSID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${SERVICE_PASSWORD_64_S3ACCESSSECRET}
    volumes:
      - fiscal-storage-data:/var/lib/storage

  # Apply app schema only after GoTrue and Storage create their own schemas.
  fiscal-migrations:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - ./supabase/migrations:/migrations/supabase:ro
      - ./deployment/supabase/migrate.sh:/migrations/migrate.sh:ro
    command: ["/bin/sh", "/migrations/migrate.sh"]

  imgproxy:
    image: darthsim/imgproxy:v3.31.4
    restart: unless-stopped
    volumes:
      - fiscal-storage-data:/var/lib/storage:ro
    healthcheck:
      test:
        [
          "CMD",
          "imgproxy",
          "health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: true
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8

  meta:
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      CRYPTO_KEY: ${SERVICE_HEX_32_PGMETACRYPTO}

  functions:
    image: supabase/edge-runtime:v1.76.2
    restart: unless-stopped
    volumes:
      - ./deployment/supabase/coolify-config/functions:/home/deno/functions:z
      - deno-cache:/root/.cache/deno
    depends_on:
      api-gw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      # Legacy symmetric HS256 key
      JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      # JWKS for token verification (EC public + legacy symmetric).
      # For Podman, use: SUPABASE_JWKS: ${JWT_JWKS}
      #SUPABASE_JWKS: ${JWT_JWKS:-{"keys":[]}}

      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: https://supabase-fiscal.oc2.freeddns.org
      # Legacy API keys (HS256-signed JWTs)
      SUPABASE_ANON_KEY: ${SERVICE_SUPABASEANON_JWT}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_SUPABASESERVICE_JWT}
      # New opaque API keys
      SUPABASE_PUBLISHABLE_KEYS: "{\"default\":\"${SUPABASE_PUBLISHABLE_KEY:-}\"}"
      SUPABASE_SECRET_KEYS: "{\"default\":\"${SUPABASE_SECRET_KEY:-}\"}"
      SUPABASE_DB_URL: postgresql://postgres:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/postgres
      # TODO: Allow configuring VERIFY_JWT per function.
      VERIFY_JWT: "true"
    command:
      [
        "start",
        "--user-worker-request-idle-timeout",
        "150000",
        "--main-service",
        "/home/deno/functions/main"
      ]

  # Comment out everything below this point if you are using an external Postgres database
  db:
    # To upgrade an existing Postgres 15 database in place, see utils/upgrade-pg17.sh.
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./deployment/supabase/coolify-config/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      # Must be superuser to create event trigger
      - ./deployment/supabase/coolify-config/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      # Must be superuser to alter reserved role
      - ./deployment/supabase/coolify-config/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      # Initialize the database settings with JWT_EXP
      - ./deployment/supabase/coolify-config/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      # PGDATA directory is persisted between restarts
      - fiscal-postgres-data:/var/lib/postgresql/data:Z
      # Changes required for internal supabase data such as _analytics
      - ./deployment/supabase/coolify-config/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      # Changes required for Analytics support
      - ./deployment/supabase/coolify-config/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      # Changes required for Pooler support
      - ./deployment/supabase/coolify-config/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      # Use named volume to persist pgsodium decryption key between restarts
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        [
        "CMD",
        "pg_isready",
        "-U",
        "postgres",
        "-h",
        "localhost"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal" # prevents Realtime polling queries from appearing in logs
      ]

  # Update the DATABASE_URL if you are using an external Postgres database
  supavisor:
    image: supabase/supavisor:2.9.12
    restart: unless-stopped
    volumes:
      - ./deployment/supabase/coolify-config/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://127.0.0.1:4000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      DATABASE_URL: ecto://supabase_admin:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/_supabase
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: ${SERVICE_BASE64_64_SECRETKEYBASE}
      VAULT_ENC_KEY: ${SERVICE_HEX_32_VAULTENCKEY}
      API_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      METRICS_JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: fiscal
      POOLER_DEFAULT_POOL_SIZE: 20
      POOLER_MAX_CLIENT_CONN: 100
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: 5
    command:
      [
        "/bin/sh",
        "-c",
        "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
      ]

  # Private cache/queue reserved for fiscal sync worker. Current sync is request-driven.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
    restart: unless-stopped
    environment:
      API_PORT: "8080"
      API_ORIGIN_KEYS: "https://fiscal.oc2.freeddns.org=${SERVICE_PASSWORD_64_APIPROXY}"
      NFE_TPAMB: ${NFE_TPAMB:-2}
      NFE_RAZAO_SOCIAL: ${NFE_RAZAO_SOCIAL:-EMPRESA NAO INFORMADA}
      NFE_CNPJ: ${NFE_CNPJ:-}
      NFE_SIGLA_UF: ${NFE_SIGLA_UF:-MG}
      NFE_SCHEMES: ${NFE_SCHEMES:-PL_009_V4}
      NFE_VERSAO: ${NFE_VERSAO:-4.00}
      NFE_VERAPLIC: ${NFE_VERAPLIC:-}
    command: ["php", "-S", "0.0.0.0:8080", "-t", "api/public", "api/router.php"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    expose:
      - "8080"
    build:
      context: ./web
      args:
        VITE_SUPABASE_URL: https://supabase-fiscal.oc2.freeddns.org
        VITE_SUPABASE_ANON_KEY: ${SERVICE_SUPABASEANON_JWT}
        VITE_NFE_TPAMB: ${NFE_TPAMB:-2}
        VITE_ALLOW_SIGNUP: "false"
    restart: unless-stopped
    environment:
      API_PROXY_KEY: ${SERVICE_PASSWORD_64_APIPROXY}
      NGINX_ENVSUBST_FILTER: API_PROXY_KEY
      SERVICE_FQDN_WEB_8080: fiscal.oc2.freeddns.org
    depends_on:
      api:
        condition: service_healthy
      fiscal-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fiscal-postgres-data:
  fiscal-storage-data:
  redis-data:
  db-config:
  deno-cache:
